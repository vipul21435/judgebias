[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "judgebias"
version = "0.1.0"
description = "Audit an LLM judge for position bias, length bias, self-preference and agreement with humans before trusting it"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vipul Raj Jha" }]
dependencies = ["numpy>=1.24", "scipy>=1.10"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]
mtbench = ["pyarrow>=14"]

[project.scripts]
judgebias = "judgebias.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/judgebias"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
